services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: deribit
      POSTGRES_USER: deribit
      POSTGRES_PASSWORD: deribit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deribit"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DERIBIT_DATABASE_URL: "postgresql+asyncpg://deribit:deribit@db:5432/deribit"
      DERIBIT_DATABASE_URL_SYNC: "postgresql://deribit:deribit@db:5432/deribit"
      DERIBIT_DERIBIT_API_URL: "https://test.deribit.com/api/v2"
      DERIBIT_FETCH_TICKERS: '["btc_usd","eth_usd"]'
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: deribit
      DB_PASSWORD: deribit
      DB_NAME: deribit
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; resp = urllib.request.urlopen('http://localhost:8000/health', timeout=5); assert resp.status == 200"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
