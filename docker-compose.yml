services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_URL=postgresql+asyncpg://derbit:derbit@db:5432/derbit
      - REDIS_URL=redis://redis:6379/0
      - DERIBIT_API_URL=https://www.deribit.com/api/v2
      - TICKERS=btc_usd,eth_usd
      - FETCH_INTERVAL_MINUTES=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-worker:
    build: .
    command: celery -A app.tasks.price_tasks.celery_app worker --loglevel=info
    environment:
      - DB_URL=postgresql+asyncpg://derbit:derbit@db:5432/derbit
      - REDIS_URL=redis://redis:6379/0
      - DERIBIT_API_URL=https://www.deribit.com/api/v2
      - TICKERS=btc_usd,eth_usd
      - FETCH_INTERVAL_MINUTES=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build: .
    command: celery -A app.tasks.price_tasks.celery_app beat --loglevel=info
    environment:
      - DB_URL=postgresql+asyncpg://derbit:derbit@db:5432/derbit
      - REDIS_URL=redis://redis:6379/0
      - DERIBIT_API_URL=https://www.deribit.com/api/v2
      - TICKERS=btc_usd,eth_usd
      - FETCH_INTERVAL_MINUTES=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=derbit
      - POSTGRES_PASSWORD=derbit
      - POSTGRES_DB=derbit
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U derbit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
